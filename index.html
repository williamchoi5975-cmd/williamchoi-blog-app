<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n8n Webhook Tester</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 10px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 90px; font-family: monospace; }
    button {
      width: 100%; padding: 12px; background: #007aff; color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background .15s;
    }
    button:active { background: #0056b3; }
    button:disabled { background: #9bbcf0; cursor: not-allowed; }
    #log {
      margin-top: 20px; padding: 12px; background: #f4f4f5;
      border-radius: 6px; white-space: pre-wrap; word-break: break-all;
      font-family: monospace; font-size: 13px; min-height: 20px;
      border-left: 4px solid #ccc;
    }
    #log.ok   { border-left-color: #34c759; }
    #log.warn { border-left-color: #ff9f0a; }
    #log.err  { border-left-color: #ff3b30; }
  </style>
</head>
<body>
  <h2>n8n Webhook Tester</h2>

  <div class="input-group">
    <label for="url">Webhook URL</label>
    <input type="url" id="url" placeholder="https://your-n8n.com/webhook/..." />
  </div>

  <div class="input-group">
    <label for="payload">Payload (JSON)</label>
    <textarea id="payload" placeholder='{"message":"hello"}'></textarea>
  </div>

  <button id="send">Send</button>
  <div id="log"></div>

  <script>
    const urlInput = document.getElementById('url');
    const payloadInput = document.getElementById('payload');
    const sendBtn = document.getElementById('send');
    const logEl = document.getElementById('log');

    function setLog(msg, type) {
      logEl.textContent = msg;
      logEl.className = type || '';
    }

    async function send() {
      const rawUrl = urlInput.value.trim();
      const rawPayload = payloadInput.value.trim();

      // 1) URL 검증
      if (!rawUrl) {
        setLog('URL을 입력하세요.', 'err');
        urlInput.focus();
        return;
      }
      let parsedUrl;
      try {
        parsedUrl = new URL(rawUrl);
      } catch {
        setLog('URL 형식이 올바르지 않습니다.\n예) https://example.com/webhook/xxx', 'err');
        return;
      }
      if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
        setLog('http 또는 https URL만 지원합니다.', 'err');
        return;
      }

      // 2) Payload 검증 (비어있으면 {})
      let payload = {};
      if (rawPayload) {
        try {
          payload = JSON.parse(rawPayload);
        } catch (e) {
          setLog('Payload가 올바른 JSON이 아닙니다.\n' + e.message, 'err');
          payloadInput.focus();
          return;
        }
      }

      // 3) 전송
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      setLog('요청 전송 중...', '');

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);

      try {
        const res = await fetch(rawUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal,
          mode: 'cors',
        });
        clearTimeout(timeout);

        const text = await res.text();

        let body;
        if (!text) {
          body = '(응답 본문 없음 — n8n Webhook의 Respond 설정을 확인하세요)';
        } else {
          try {
            body = JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            body = text;
          }
        }

        const type = res.ok ? 'ok' : 'err';
        setLog(`Status: ${res.status} ${res.statusText}\n\n${body}`, type);
      } catch (e) {
        clearTimeout(timeout);

        if (e.name === 'AbortError') {
          setLog('요청 시간 초과 (15초).\n서버 응답이 없거나 네트워크가 느립니다.', 'err');
        } else if (e instanceof TypeError) {
          // fetch 실패의 대표 원인: CORS, DNS, Mixed Content, 서버 다운
          setLog(
            '네트워크 오류가 발생했습니다.\n\n' +
            '가능한 원인:\n' +
            '• CORS: n8n Webhook 노드의 Allowed Origins에 이 페이지 origin 추가\n' +
            '• HTTPS 페이지에서 http:// webhook 호출 (Mixed Content 차단)\n' +
            '• URL 오타 / 서버 미실행 / 방화벽\n\n' +
            '브라우저 콘솔(F12)의 에러 메시지를 확인하세요.\n' +
            '원본: ' + e.message,
            'err'
          );
        } else {
          setLog('오류: ' + e.message, 'err');
        }
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    }

    sendBtn.addEventListener('click', send);
    // Enter 키로 전송 (textarea에서는 줄바꿈 유지, Ctrl/Cmd+Enter로 전송)
    payloadInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') send();
    });
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
